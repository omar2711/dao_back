# DAO Dent · stack de producción (camino D)
#
# Se copia a /opt/daodent/docker-compose.yml en el VPS. Las imágenes las publica
# GitHub Actions en GHCR; aquí solo se descargan, el servidor no compila nada.
#
# PostgreSQL NO está aquí: corre como servicio del sistema en el host. El backend
# lo alcanza por la PASARELA de esta red, 172.28.0.1, que desde dentro de un
# contenedor es el host. Eso exige tres cosas en el servidor, detalladas en
# INSTALAR-EN-VPS.md §4.2:
#   1. postgresql.conf → listen_addresses = 'localhost,172.28.0.1'
#   2. pg_hba.conf     → permite 172.28.0.0/16 con scram-sha-256
#   3. ufw             → allow from 172.28.0.0/16 to any port 5432
#
# La subred y la pasarela se fijan abajo justo para eso: con las que Docker
# asigna al azar habría que reconfigurar Postgres cada vez que cambiaran.
#
# Deliberadamente NO se usa `host.docker.internal` con `extra_hosts: host-gateway`:
# eso resuelve a la IP del bridge por defecto (docker0, 172.17.0.1), que NO es la
# pasarela de esta red, así que Postgres atado a 172.28.0.1 nunca recibiría la
# conexión. Comprobado.
#
# Ficheros que espera encontrar en /opt/daodent/:
#   .env        REDIS_PASSWORD, BACK_TAG, FRONT_TAG   (lo lee compose)
#   back.env    variables del backend                 (lo lee el contenedor)

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?falta REDIS_PASSWORD en /opt/daodent/.env}"]
    volumes:
      # Bind mount y no volumen con nombre: `docker compose down -v` no se lleva
      # las colas de recordatorios pendientes.
      - /opt/daodent/shared/redis:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    # Sin `ports`: solo lo alcanzan los contenedores de esta red.

  backend:
    image: ghcr.io/omar2711/dao-back:${BACK_TAG:-latest}
    env_file: /opt/daodent/back.env
    environment:
      # Se fija aquí y no en back.env para que la contraseña viva en un solo
      # sitio y no se puedan desincronizar.
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    volumes:
      - /opt/daodent/shared/uploads:/app/uploads
      - /opt/daodent/shared/whatsapp-auth:/app/whatsapp-auth
    ports:
      # 127.0.0.1 explícito. Con la forma corta "3001:3001" Docker publica en
      # todas las interfaces y escribe reglas de iptables POR DEBAJO de ufw, así
      # que `ufw deny 3001` no protegería nada. Atarlo a loopback sí.
      - "127.0.0.1:3001:3001"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    # UNA SOLA INSTANCIA, SIEMPRE. El socket de Baileys y el worker de BullMQ
    # asumen exclusividad: dos procesos desloguean WhatsApp en bucle y duplican
    # los recordatorios. Nunca `docker compose up --scale backend=N`.
    deploy:
      replicas: 1
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  frontend:
    image: ghcr.io/omar2711/dao-front:${FRONT_TAG:-latest}
    ports:
      - "127.0.0.1:3000:3000"
    # Solo orden de arranque, SIN `condition: service_healthy`. El frontend no
    # necesita al backend para servir páginas: las llamadas a la API salen del
    # navegador. Con la condición de salud, una caída de la base dejaba al
    # backend unhealthy y entonces el frontend NI SIQUIERA ARRANCABA — un
    # problema de base de datos se convertía en el sitio entero caído, login
    # incluido, y `docker compose up -d` se negaba a levantarlo.
    depends_on:
      - backend
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

networks:
  # Subred y pasarela fijas para que 172.28.0.1 sea SIEMPRE el host visto desde
  # los contenedores. Es lo que permite atar Postgres a esa dirección concreta en
  # vez de dejarlo escuchando en '*', y acotar la regla de ufw a este rango.
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1
