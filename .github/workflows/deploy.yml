# Camino D: Actions construye la imagen y la publica en GHCR; el VPS solo la
# descarga. El servidor de producción no compila nada, así que un despliegue no
# le roba CPU a la clínica, y volver atrás es cambiar una etiqueta.
#
# El VPS no ejecuta nada arbitrario: la clave de despliegue está restringida con
# `command="/opt/daodent/ci-deploy.sh"` en su authorized_keys, así que el único
# efecto posible de este workflow es lanzar ese script con el argumento `back`.
#
# Secretos necesarios (Settings → Secrets and variables → Actions):
#   VPS_HOST         IP o dominio del VPS
#   VPS_USER         ci
#   VPS_SSH_KEY      clave privada completa, con cabeceras, sin passphrase
#   VPS_KNOWN_HOSTS  salida de `ssh-keyscan <host>`
# GITHUB_TOKEN es automático: no hay que crearlo.

name: Construir y desplegar backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Nunca dos despliegues solapados: dos backends vivos a la vez desloguean la
  # sesión de WhatsApp en bucle y duplican los recordatorios.
  group: deploy-back
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/dao-back

jobs:
  verify:
    name: Verificar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Comprobar tipos
        run: npx tsc --noEmit -p tsconfig.json

      - name: Compilar
        run: npm run build

      - name: Tests
        run: npm test

      # Informativo: falla el paso pero no el workflow. Sirve para enterarse de
      # una vulnerabilidad nueva sin bloquear un despliegue urgente.
      - name: Auditoría de dependencias de producción
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  build:
    name: Construir imagen
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # necesario para publicar en GHCR
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          # En pull requests se construye para comprobar que el Dockerfile sigue
          # siendo válido, pero no se publica nada.
          push: ${{ github.event_name != 'pull_request' }}
          # La doble etiqueta es lo que hace posible el rollback: `latest` para el
          # flujo normal, el SHA concreto para volver a una versión buena.
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Desplegar en el VPS
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar que los secretos existen
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          missing=""
          [ -n "$HOST" ]  || missing="$missing VPS_HOST"
          [ -n "$USER" ]  || missing="$missing VPS_USER"
          [ -n "$KEY" ]   || missing="$missing VPS_SSH_KEY"
          [ -n "$KNOWN" ] || missing="$missing VPS_KNOWN_HOSTS"
          if [ -n "$missing" ]; then
            echo "Faltan secretos:$missing" >&2
            exit 1
          fi

      - name: Configurar SSH
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # known_hosts fijado a mano: sin esto haría falta
          # StrictHostKeyChecking=no, que acepta a ciegas cualquier servidor que
          # responda, incluido uno interpuesto.
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Desplegar
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes \
              "$USER@$HOST" back
